name: Salesforce Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: devShikhar_org

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: DevShikhar
          repositories: |
            devShikharGit

      - name: Checkout Salesforce Source
        uses: actions/checkout@v4
        with:
          repository: DevShikhar/devShikharGit
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Create JWT Key
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Salesforce
        run: |
          sf org login jwt \
            --username "${{ secrets.SF_USERNAME }}" \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}"

      - name: Validate Deployment
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org "${{ secrets.SF_USERNAME }}" \
            --test-level RunLocalTests \
            --wait 120

      - name: Deploy Metadata
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org "${{ secrets.SF_USERNAME }}" \
            --test-level RunLocalTests \
            --wait 120
